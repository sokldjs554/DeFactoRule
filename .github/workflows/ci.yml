name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 를 함께 도는 이유는 실행 문턱 때문이다. macOS 기본 python3 가
        # 3.9 인 경우가 많아 `StrEnum` 하나로 실행이 막힌 적이 있다.
        # 3.9 에서 깨지는 문법은 여기서 잡는다.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # OCR은 시스템 엔진 평가라 Python matrix에서 중복 실행하지 않는다.
      # 3.11 job이 전용 Document AI checks + 60문서×3프로필 benchmark를 담당한다.
      - name: OCR 시스템 의존성
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 린트
        run: ruff check .

      # 원본 PDF 는 저장소에 없으므로 서식 회귀 테스트는 자동으로 건너뛰고,
      # 커밋된 파싱 결과에 대한 불변조건 검사만 돌아간다.
      - name: 테스트
        run: pytest tests -v

      - name: Evidence RAG 오프라인 평가
        run: python scripts/evaluate_rag.py

      - name: Document AI realistic synthetic scan 평가
        if: matrix.python-version == '3.11'
        run: python scripts/evaluate_document_ai.py --n 60

      - name: 코퍼스 규모 보고
        run: |
          for f in data/processed/*.jsonl; do
            printf '%8d  %s\n' "$(wc -l < "$f")" "$f"
          done
